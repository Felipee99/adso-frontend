<!doctype html>
<html lang="es">
  <head>
    <!-- META -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TÍTULO -->
    <title>Subnautica UI</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/ubicaciones.css" />

    <!-- FUENTE -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- ICONOS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="phone-container">

        <a href="ubicaciones.html" class="back-btn">
        <span>&larr;</span>
      </a>

      <!-- ========================================= -->
      <!-- RADAR SUPERIOR -->
      <!-- ========================================= -->

      <div class="top-circle">
        <div class="top-radar">
          <img src="img/map-pin.png" alt="Ubicación" />
        </div>
      </div>

      <!-- ========================================= -->
      <!-- PANEL DE UBICACIÓN -->
      <!-- ========================================= -->

      <div class="location-panel">
        <div class="map-container">
          <img src="img/mapa.png" alt="Mapa" />
        </div>
      </div>

      <!-- ========================================= -->
      <!-- INFORMACIÓN DE UBICACIÓN -->
      <!-- ========================================= -->

      <div class="location-info">
        <div class="location-row">
          <span></span>
          <span>Nombre</span>
        </div>

        <div class="location-row">
          <span></span>
          <span>Mortalidad</span>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- BOTÓN AGREGAR -->
      <!-- ========================================= -->

      <div class="location-footer">
        <a href="ubicaciones.html" class="glass-footer add-location-btn">
          <span class="btn">Crear</span>
        </a>
      </div>

      <!-- ========================================= -->
      <!-- LOGO INFERIOR -->
      <!-- ========================================= -->

      <div class="group">
        <img src="img/Group.png" alt="Logo" />
      </div>

      <!-- ========================================= -->
      <!-- MENÚ INFERIOR -->
      <!-- ========================================= -->

      <div class="menu">

        <a href="dashboard.html" class="glass-btn2 active-btn">
          <span class="center">
            <span class="orange">Dash</span>
            <span class="white">board</span>
          </span>
        </a>

        <a href="profile.html" class="glass-btn3">
          <span>
            <span class="orange">My</span>
            <span class="white">Profile</span>
          </span>
        </a>

        <a href="leviatanes.html" class="glass-btn4">
          <span>
            <span class="orange">Lev</span>
            <span class="white">iatan</span>
          </span>
        </a>

        <a href="ubicaciones.html" class="glass-btn5">
          <span>
            <span class="orange">Ubi</span>
            <span class="white">cacion</span>
          </span>
        </a>

      </div>

      <!-- ========================================= -->
      <!-- BURBUJAS -->
      <!-- ========================================= -->

      <div class="bubbles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>
  </body>
</html>
